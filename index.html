<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Campus Connect — Sign in to your campus community. Access announcements, discussions, polls, and tests." />
  <meta name="theme-color" content="#1a1a1b" />
  <title>Campus Connect — Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-page" id="loginPage">
    <div class="login-container">
      <div class="login-logo">
        <div class="login-logo-icon">🎓</div>
        <span class="login-logo-text">Campus Connect</span>
      </div>

      <h1 class="login-title">Sign in to your account</h1>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            type="email"
            class="form-input"
            id="email"
            placeholder="your.email@campus.edu"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            class="form-input"
            id="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>

        <div id="loginError" class="form-error hidden"></div>

        <button type="submit" class="btn btn-primary btn-block btn-lg mt-lg" id="loginBtn">
          Log In
        </button>
      </form>

      <p class="form-hint mt-lg text-center">
        Account created by your admin. Contact admin if you need access.
      </p>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=2"></script>
  <script>
    // Check if already logged in
    (async function() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = 'home.html';
      }
    })();

    // Login form handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      errorEl.classList.add('hidden');
      btn.textContent = 'Signing in...';
      btn.disabled = true;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = 'home.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed. Please try again.';
        errorEl.classList.remove('hidden');
        btn.textContent = 'Log In';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
