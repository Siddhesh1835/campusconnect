<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Campus Connect — Take MCQ tests from your community teachers." />
  <meta name="theme-color" content="#1a1a1b" />
  <title>Campus Connect — Tests</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============== HEADER ============== -->
  <header class="header">
    <a href="home.html" class="header-logo">
      <div class="header-logo-icon">🎓</div>
      <span class="header-logo-text">Campus Connect</span>
    </a>
    <div class="header-search">
      <svg class="header-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="header-search-input" placeholder="Search Campus Connect" />
    </div>
    <div class="header-actions">
      <div class="user-menu" id="userMenu">
        <button class="user-menu-trigger" id="userMenuTrigger">
          <div class="user-avatar">👤</div>
          <span class="user-menu-name" id="userName">User</span>
          <svg class="user-menu-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="user-dropdown" id="userDropdown">
          <button class="user-dropdown-item" onclick="window.location.href='home.html'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home
          </button>
          <button class="user-dropdown-item" id="viewProfile" onclick="window.location.href='profile.html'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            View Profile
          </button>
          <button class="user-dropdown-item" onclick="window.location.href='dashboard.html'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            Dashboard
          </button>
          <div class="user-dropdown-divider"></div>
          <button class="user-dropdown-item" id="logoutBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Log Out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ============== TEST PAGE ============== -->
  <div class="post-detail-layout">
    <a href="home.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to feed
    </a>

    <div class="test-container">
      <h1 class="create-post-title mb-xl">📝 Tests</h1>

      <!-- Test List (default view) -->
      <div id="testListView">
        <div class="loading-state">
          <div class="spinner"></div>
        </div>
      </div>

      <!-- Test Taking View (hidden until a test is selected) -->
      <div id="testTakingView" class="hidden">
        <div class="test-header" id="testHeader"></div>
        <div id="questionsContainer"></div>
        <div class="mt-xl" id="testActions"></div>
        <div id="scoreResult" class="hidden"></div>
      </div>

      <!-- Teacher: Schedule Test Link -->
      <div id="teacherScheduleLink" class="hidden mt-xl">
        <a href="schedule-test.html" class="btn btn-secondary btn-block">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Schedule New Test
        </a>
      </div>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    let currentUser = null;
    let currentTest = null;
    let selectedAnswers = {};

    async function initTestPage() {
      const session = await Auth.requireAuth();
      if (!session) return;

      currentUser = await Auth.getProfile();
      if (currentUser) {
        document.getElementById('userName').textContent = currentUser.full_name;
      }

      setupUserMenu();

      if (currentUser.role === 'teacher' || currentUser.role === 'admin') {
        window.location.href = 'schedule-test.html';
        return;
      }

      // Check if specific test is requested
      const params = new URLSearchParams(window.location.search);
      const testId = params.get('id');

      if (testId) {
        await loadTest(testId);
      } else {
        await loadTestList();
      }

      // Show schedule link for teachers
      if (currentUser.role === 'teacher' || currentUser.role === 'admin') {
        document.getElementById('teacherScheduleLink').classList.remove('hidden');
      }
    }

    // Load available tests
    async function loadTestList() {
      const { data: tests, error } = await supabase
        .from('mcq_tests')
        .select(`
          *,
          communities:community_id (name, icon_emoji),
          profiles:created_by (full_name)
        `)
        .eq('is_active', true)
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('testListView').innerHTML = '<div class="empty-state"><div class="empty-state-title">Failed to load tests</div></div>';
        return;
      }

      // Check which tests user has already submitted
      const testIds = (tests || []).map(t => t.id);
      let submissions = [];
      if (testIds.length > 0) {
        const { data: subs } = await supabase
          .from('mcq_submissions')
          .select('test_id, score, total_questions')
          .eq('student_id', currentUser.id)
          .in('test_id', testIds);
        submissions = subs || [];
      }

      if (!tests || tests.length === 0) {
        document.getElementById('testListView').innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <div class="empty-state-title">No tests available</div>
            <p class="empty-state-text">Tests scheduled by your teachers will appear here.</p>
          </div>
        `;
        return;
      }

      const html = tests.map(test => {
        const sub = submissions.find(s => s.test_id === test.id);
        const statusHTML = sub
          ? `<span class="test-status completed">✓ Completed (${sub.score}/${sub.total_questions})</span>`
          : `<span class="test-status active">● Available</span>`;

        return `
          <div class="test-list-card" onclick="${sub ? '' : `startTest('${test.id}')`}" style="${sub ? 'opacity:0.7;cursor:default;' : ''}">
            <div class="test-list-info">
              <div class="test-list-title">${escapeHTML(test.title)}</div>
              <div class="test-list-meta">
                <span>${test.communities?.icon_emoji || '📚'} ${escapeHTML(test.communities?.name || 'Unknown')}</span>
                <span>By ${escapeHTML(test.profiles?.full_name || 'Teacher')}</span>
                <span>${Auth.timeAgo(test.created_at)}</span>
              </div>
            </div>
            ${statusHTML}
          </div>
        `;
      }).join('');

      document.getElementById('testListView').innerHTML = html;
    }

    // Start taking a test
    async function startTest(testId) {
      await loadTest(testId);
    }

    // Load test questions
    async function loadTest(testId) {
      // Get test info
      const { data: test, error: testErr } = await supabase
        .from('mcq_tests')
        .select(`*, communities:community_id (name, icon_emoji), profiles:created_by (full_name)`)
        .eq('id', testId)
        .single();

      if (testErr || !test) {
        showToast('Test not found', 'error');
        return;
      }

      // Check if already submitted
      const { data: existing } = await supabase
        .from('mcq_submissions')
        .select('*')
        .eq('test_id', testId)
        .eq('student_id', currentUser.id)
        .single();

      if (existing) {
        showToast('You have already completed this test', 'error');
        return;
      }

      currentTest = test;
      selectedAnswers = {};

      // Get questions with options
      const { data: questions } = await supabase
        .from('mcq_questions')
        .select(`*, mcq_options (*)`)
        .eq('test_id', testId)
        .order('question_index');

      // Show test view
      document.getElementById('testListView').classList.add('hidden');
      document.getElementById('testTakingView').classList.remove('hidden');

      document.getElementById('testHeader').innerHTML = `
        <div class="test-title">${escapeHTML(test.title)}</div>
        <div class="test-info">
          <span class="test-info-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            By ${escapeHTML(test.profiles?.full_name || 'Teacher')}
          </span>
          <span class="test-info-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${test.duration_minutes || 30} min
          </span>
          <span class="test-info-item">${questions?.length || 0} questions</span>
        </div>
      `;

      const questionsHTML = (questions || []).map((q, qi) => {
        const options = (q.mcq_options || []).sort((a, b) => a.option_index - b.option_index);
        return `
          <div class="question-card" style="animation-delay:${qi * 0.08}s">
            <div class="question-number">Question ${qi + 1}</div>
            <div class="question-text">${escapeHTML(q.question_text)}</div>
            <div class="question-options">
              ${options.map(opt => `
                <div class="question-option" id="opt-${opt.id}" data-question-id="${q.id}" data-option-id="${opt.id}" onclick="selectOption('${q.id}', '${opt.id}')">
                  <div class="option-radio"></div>
                  <span class="option-text">${escapeHTML(opt.option_text)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('questionsContainer').innerHTML = questionsHTML;
      document.getElementById('testActions').innerHTML = `
        <button class="btn btn-primary btn-lg btn-block" onclick="submitTest('${testId}')">Submit Test</button>
      `;
    }

    // Select an option
    function selectOption(questionId, optionId) {
      // Deselect previous
      document.querySelectorAll(`[data-question-id="${questionId}"]`).forEach(el => {
        el.classList.remove('selected');
      });

      // Select new
      document.getElementById(`opt-${optionId}`).classList.add('selected');
      selectedAnswers[questionId] = optionId;
    }

    // Submit test
    async function submitTest(testId) {
      // Get questions with correct answers
      const { data: questions } = await supabase
        .from('mcq_questions')
        .select(`id, mcq_options (id, is_correct)`)
        .eq('test_id', testId);

      if (!questions) {
        showToast('Failed to grade test', 'error');
        return;
      }

      let score = 0;
      const totalQuestions = questions.length;

      questions.forEach(q => {
        const selectedOptId = selectedAnswers[q.id];
        const correctOpt = q.mcq_options.find(o => o.is_correct);

        if (selectedOptId && correctOpt && selectedOptId === correctOpt.id) {
          score++;
          // Show correct
          document.getElementById(`opt-${selectedOptId}`)?.classList.add('correct');
        } else {
          // Show wrong selection
          if (selectedOptId) {
            document.getElementById(`opt-${selectedOptId}`)?.classList.add('wrong');
          }
          // Show correct answer
          if (correctOpt) {
            document.getElementById(`opt-${correctOpt.id}`)?.classList.add('correct');
          }
        }
      });

      // Disable all options
      document.querySelectorAll('.question-option').forEach(el => {
        el.style.pointerEvents = 'none';
      });

      // Save submission
      await supabase.from('mcq_submissions').insert({
        test_id: testId,
        student_id: currentUser.id,
        answers: selectedAnswers,
        score: score,
        total_questions: totalQuestions
      });

      // Show score
      document.getElementById('testActions').innerHTML = '';
      document.getElementById('scoreResult').classList.remove('hidden');
      document.getElementById('scoreResult').innerHTML = `
        <div class="score-card">
          <div class="score-value">${score}/${totalQuestions}</div>
          <div class="score-label">Your Score</div>
          <p class="text-muted mt-lg">${score === totalQuestions ? '🎉 Perfect score!' : score >= totalQuestions * 0.7 ? '👏 Great job!' : '📚 Keep studying!'}</p>
          <a href="test.html" class="btn btn-secondary mt-lg">Back to Tests</a>
        </div>
      `;
    }

    // Utilities
    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function setupUserMenu() {
      const trigger = document.getElementById('userMenuTrigger');
      const dropdown = document.getElementById('userDropdown');
      const menu = document.getElementById('userMenu');
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
        menu.classList.toggle('open');
      });
      document.addEventListener('click', () => {
        dropdown.classList.remove('open');
        menu.classList.remove('open');
      });
      document.getElementById('logoutBtn').addEventListener('click', () => Auth.logout());
    }

    function showToast(message, type = '') {
      let toast = document.querySelector('.toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'toast';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      toast.className = `toast ${type}`;
      void toast.offsetWidth;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    document.addEventListener('DOMContentLoaded', initTestPage);
  </script>
</body>
</html>
